<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Node Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💾 Storage Node Dashboard</h1>
            <p class="subtitle">Manage your storage provider node</p>
        </header>

        <!-- Status Card -->
        <div class="card">
            <h2>Node Status</h2>
            <div id="status" class="loading">Loading...</div>
        </div>

        <!-- Configuration Card -->
        <div class="card">
            <h2>Configuration</h2>
            <div class="form-group">
                <label for="paymentWallet">Payment Wallet Address</label>
                <input type="text" id="paymentWallet" placeholder="0x...">
                <button onclick="updatePaymentWallet()">Update Payment Wallet</button>
            </div>
            
            <div class="form-group">
                <label>Storage Lending</label>
                <div class="toggle-group">
                    <span id="lendingStatus">Disabled</span>
                    <button id="lendingToggle" onclick="toggleStorageLending()" class="btn-disable">Enable</button>
                </div>
            </div>
        </div>

        <!-- Registry Card -->
        <div class="card">
            <h2>Blockchain Registry</h2>
            <div id="registryStatus" class="loading">Checking registry status...</div>
            
            <div class="form-group" id="registerForm" style="display: none;">
                <label for="storageGB">Available Storage (GB)</label>
                <input type="number" id="storageGB" placeholder="100">
                <label for="pricePerGB">Price per GB (ETH)</label>
                <input type="number" id="pricePerGB" step="0.001" placeholder="0.001">
                <button onclick="registerWithRegistry()">Register with Registry</button>
            </div>
            
            <div class="button-group">
                <button onclick="updateRegistryStorage()" id="updateBtn" style="display: none;">Update Storage</button>
                <button onclick="activateInRegistry()" id="activateBtn" style="display: none;">Activate</button>
                <button onclick="deactivateInRegistry()" id="deactivateBtn" style="display: none;">Deactivate</button>
            </div>
        </div>

        <!-- Storage Info Card -->
        <div class="card">
            <h2>Storage Information</h2>
            <div id="storageInfo" class="loading">Loading...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
